<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0c10"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7928CA"/><stop offset="50%" stop-color="#FF0080"/><stop offset="100%" stop-color="#00DFD8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtle-glow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-node{0%{r:6px;opacity:.4}50%{r:10px;opacity:.9}}@keyframes flow-line{0%{stroke-dashoffset:100}}@keyframes float-particle{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-15px) scale(1.2);opacity:.7}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:900;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:20px;fill:#8b949e}.badge-text{font-weight:600;font-size:13px;fill:#00dfd8}.node-1{animation:pulse-node 3s infinite ease-in-out}.node-2{animation:pulse-node 4s infinite ease-in-out 1s}.node-3{animation:pulse-node 3.5s infinite ease-in-out .5s}.floating-bg-1{animation:float-particle 6s infinite ease-in-out}.floating-bg-2{animation:float-particle 8s infinite ease-in-out 2s}</style><rect width="1200" height="360" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2" rx="16"/><g opacity=".25"><path fill="none" stroke="url(#accent-grad)" stroke-dasharray="8 4" stroke-width="2" d="M 150 80 L 300 160 L 200 280"/><path fill="none" stroke="url(#accent-grad)" stroke-dasharray="6 4" stroke-width="2" d="M 1050 70 L 920 180 L 1000 290"/><circle cx="150" cy="80" r="8" fill="#FF0080" class="node-1"/><circle cx="300" cy="160" r="10" fill="#7928CA" class="node-2"/><circle cx="200" cy="280" r="7" fill="#00DFD8" class="node-3"/><circle cx="1050" cy="70" r="9" fill="#00DFD8" class="node-2"/><circle cx="920" cy="180" r="11" fill="#FF0080" class="node-3"/><circle cx="1000" cy="290" r="7" fill="#7928CA" class="node-1"/><circle cx="100" cy="60" r="80" fill="#7928CA" class="floating-bg-1" filter="url(#glow)" opacity=".15"/><circle cx="1100" cy="300" r="100" fill="#00DFD8" class="floating-bg-2" filter="url(#glow)" opacity=".12"/></g><g text-anchor="middle"><rect width="320" height="32" x="440" y="55" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="16"/><text x="600" y="76" class="badge-text" text-anchor="middle">⚡ REAL-TIME MESSAGING &amp; NOTIFICATIONS</text><text x="600" y="150" class="title" filter="url(#subtle-glow)">Awesome Pub/Sub &amp; Push Notifications</text><rect width="400" height="4" x="400" y="175" fill="url(#accent-grad)" rx="2"/><text x="600" y="225" class="subtitle">A Curated Ecosystem of SaaS Platforms &amp; Open-Source Infrastructure</text><g transform="translate(340, 260)"><rect width="150" height="34" x="0" y="0" fill="#21262d" stroke="#30363d" rx="8"/><text x="75" y="22" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📲 Web &amp; Mobile Push</text><rect width="190" height="34" x="165" y="0" fill="#21262d" stroke="#30363d" rx="8"/><text x="260" y="22" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📬 Multi-Channel Workflows</text><rect width="150" height="34" x="370" y="0" fill="#21262d" stroke="#30363d" rx="8"/><text x="445" y="22" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Self-Hosted Pub/Sub</text></g></g></svg>