<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Accent Gradient for Text/Border -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8b949e;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00DFD8;
    }
    
    /* Subtle Dynamic Animations in Background (Behind Text) */
    @keyframes pulse-node {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 10px; opacity: 0.9; }
      100% { r: 6px; opacity: 0.4; }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }

    .node-1 { animation: pulse-node 3s infinite ease-in-out; }
    .node-2 { animation: pulse-node 4s infinite ease-in-out 1s; }
    .node-3 { animation: pulse-node 3.5s infinite ease-in-out 0.5s; }
    
    .floating-bg-1 { animation: float-particle 6s infinite ease-in-out; }
    .floating-bg-2 { animation: float-particle 8s infinite ease-in-out 2s; }
  </style>

  <!-- Background Card -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Dynamic Network Graphic (Low Opacity, Positioned to Not Obstruct Text) -->
  <g opacity="0.25">
    <!-- Connecting Lines -->
    <path d="M 150 80 L 300 160 L 200 280" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="8 4" fill="none"/>
    <path d="M 1050 70 L 920 180 L 1000 290" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
    
    <!-- Background Nodes -->
    <circle cx="150" cy="80" r="8" fill="#FF0080" class="node-1"/>
    <circle cx="300" cy="160" r="10" fill="#7928CA" class="node-2"/>
    <circle cx="200" cy="280" r="7" fill="#00DFD8" class="node-3"/>
    
    <circle cx="1050" cy="70" r="9" fill="#00DFD8" class="node-2"/>
    <circle cx="920" cy="180" r="11" fill="#FF0080" class="node-3"/>
    <circle cx="1000" cy="290" r="7" fill="#7928CA" class="node-1"/>

    <!-- Glowing Orbs in Corners -->
    <circle cx="100" cy="60" r="80" fill="#7928CA" opacity="0.15" filter="url(#glow)" class="floating-bg-1"/>
    <circle cx="1100" cy="300" r="100" fill="#00DFD8" opacity="0.12" filter="url(#glow)" class="floating-bg-2"/>
  </g>

  <!-- Content Box / Foreground (Clean & High Contrast) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="440" y="55" width="320" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="600" y="76" class="badge-text" text-anchor="middle">⚡ REAL-TIME MESSAGING &amp; NOTIFICATIONS</text>

    <!-- Main Title -->
    <text x="600" y="150" class="title" filter="url(#subtle-glow)">Awesome Pub/Sub &amp; Push Notifications</text>
    
    <!-- Gradient Accent Line Below Title -->
    <rect x="400" y="175" width="400" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="600" y="225" class="subtitle">A Curated Ecosystem of SaaS Platforms &amp; Open-Source Infrastructure</text>

    <!-- Channel Pills -->
    <g transform="translate(340, 260)">
      <!-- Pill 1: Web & Mobile Push -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="75" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">📲 Web &amp; Mobile Push</text>

      <!-- Pill 2: Multi-Channel APIs -->
      <rect x="165" y="0" width="190" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="260" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">📬 Multi-Channel Workflows</text>

      <!-- Pill 3: Self-Hosted Pub/Sub -->
      <rect x="370" y="0" width="150" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="445" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">🚀 Self-Hosted Pub/Sub</text>
    </g>
  </g>
</svg>
